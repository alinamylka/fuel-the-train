spring.application.name=fuel-the-train
server.port=8765

spring.datasource.url=jdbc:h2:file:./data/fuel-the-train;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Error responses as RFC 9457 problem details, so the frontend can read "detail"
spring.mvc.problemdetails.enabled=true
spring.h2.console.enabled=true

# webcal:// or https:// link from TrainingPeaks (Settings -> Calendar sync). Keep it in .env, never in git.
trainingpeaks.ical-url=${TP_ICAL_URL:}

# intervals.icu API key (Settings -> Developer Settings). Normally saved in the app, this is a fallback.
intervals.api-key=${INTERVALS_API_KEY:}

# Local secrets, see ../.env
spring.config.import=optional:file:../.env[.properties]
